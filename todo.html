<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>To-Do App</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #1a6fc4;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  h1 { margin: 0 0 20px; font-size: 24px; color: #1a6fc4; }
  .input-row { display: flex; gap: 8px; margin-bottom: 20px; }
  .input-row input {
    flex: 1;
    padding: 10px 14px;
    border: 1.5px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  .input-row input:focus { border-color: #1a6fc4; }
  .input-row button {
    background: #1a6fc4;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
  }
  .input-row button:hover { background: #155aa0; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 8px;
    background: #f4f8ff;
  }
  li span {
    flex: 1;
    font-size: 14px;
    color: #333;
  }
  li.done span { text-decoration: line-through; color: #aaa; }
  li input[type="checkbox"] { cursor: pointer; width: 16px; height: 16px; accent-color: #1a6fc4; }
  li button {
    background: none;
    border: none;
    color: #ccc;
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
  }
  li button:hover { color: #e33; }
  .empty { text-align: center; color: #aaa; font-size: 14px; padding: 16px 0; }
</style>
</head>
<body>
<div class="card">
  <h1>To-Do List</h1>
  <div class="input-row">
    <input id="inp" type="text" placeholder="Add a task..." maxlength="100"/>
    <button onclick="addTask()">Add</button>
  </div>
  <ul id="list"></ul>
  <p class="empty" id="empty">No tasks yet. Add one above!</p>
</div>
<script>
  let tasks = [];
  const inp = document.getElementById('inp');
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');

  function render() {
    list.innerHTML = '';
    empty.style.display = tasks.length ? 'none' : 'block';
    tasks.forEach((t, i) => {
      const li = document.createElement('li');
      if (t.done) li.classList.add('done');
      li.innerHTML = `
        <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggle(${i})"/>
        <span>${t.text}</span>
        <button onclick="remove(${i})">×</button>
      `;
      list.appendChild(li);
    });
  }

  function addTask() {
    const text = inp.value.trim();
    if (!text) return;
    tasks.push({ text, done: false });
    inp.value = '';
    render();
  }

  function toggle(i) { tasks[i].done = !tasks[i].done; render(); }
  function remove(i) { tasks.splice(i, 1); render(); }

  inp.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
  render();
</script>
</body>
</html>
